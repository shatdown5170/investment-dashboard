name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          if grep -q "<!-- keepalive -->" README.md 2>/dev/null; then
            sed -i "s|<!-- keepalive:.*-->|<!-- keepalive: ${DATE} -->|" README.md
          else
            echo "" >> README.md
            echo "<!-- keepalive: ${DATE} -->" >> README.md
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: keepalive commit (auto)"
          git push
